<title>スイング銘柄ランキング</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-width column. Sticky date header, market strip, then a ranked list whose rows open in place. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#111827; --ink2:#4b5563; --muted:#8a93a3;
  --line:#e3e7ee; --accent:#1f3a8a; --accent-soft:#e6ebf8;
  --series:#2a78d6; --series-soft:rgba(42,120,214,.12); --grid:#e3e7ee; --axis:#c2c8d2;
  --good:#0a7d32; --good-soft:#dff3e5; --bad:#c13030; --bad-soft:#fbe4e4;
  --warn-bg:#fff6dc; --warn-line:#f0cf6b; --warn-ink:#5c4400;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#171b23; --ink:#eef0f4; --ink2:#b6bdc9; --muted:#7f8898;
  --line:#272d39; --accent:#9db4ff; --accent-soft:#1f2a47;
  --series:#3987e5; --series-soft:rgba(57,135,229,.16); --grid:#272d39; --axis:#3a4250;
  --good:#3ecf6e; --good-soft:#12301d; --bad:#f07878; --bad-soft:#3a1a1a;
  --warn-bg:#2f2710; --warn-line:#6b5718; --warn-ink:#f1dc9a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#171b23; --ink:#eef0f4; --ink2:#b6bdc9; --muted:#7f8898;
  --line:#272d39; --accent:#9db4ff; --accent-soft:#1f2a47;
  --series:#3987e5; --series-soft:rgba(57,135,229,.16); --grid:#272d39; --axis:#3a4250;
  --good:#3ecf6e; --good-soft:#12301d; --bad:#f07878; --bad-soft:#3a1a1a;
  --warn-bg:#2f2710; --warn-line:#6b5718; --warn-ink:#f1dc9a; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);
  border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:10px}
header.top h1{font-size:17px;margin:0;letter-spacing:.01em}
header.top .date{font-size:12px;color:var(--ink2);white-space:nowrap}

main.wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px 28px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:8px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.markets{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.mk:first-child{border-top:0}
.mk .name{font-weight:600;flex:0 0 auto}
.mk .desc{color:var(--ink2);font-size:12px;flex:1;min-width:0}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ng{background:var(--bad-soft);color:var(--bad)}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:13px}

.tools{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
#q{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:16px}
.count{font-size:12px;color:var(--muted)}

ol.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
ol.list>li{border-top:1px solid var(--line)}
ol.list>li:first-child{border-top:0}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px}
.rank{font-size:15px;font-weight:700;color:var(--muted);text-align:right}
li.cand .rank{color:var(--good)}
.id{min-width:0}
.sym{font-weight:700;font-size:16px;letter-spacing:.01em}
.nm{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crit{display:flex;gap:3px;margin-top:5px}
.crit span{font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:5px;border:1px solid transparent}
.crit .y{background:var(--good-soft);color:var(--good)}
.crit .x{border-color:var(--line);color:var(--muted);text-decoration:line-through}
.crit .na{border:1px dashed var(--line);color:var(--muted)}
.side{text-align:right;white-space:nowrap}
.score{font-size:17px;font-weight:700}
.score small{font-size:12px;color:var(--muted);font-weight:600}
.chg{font-size:11px;color:var(--muted)}
.chg.up{color:var(--good)} .chg.down{color:var(--bad)} .chg.new{color:var(--accent);font-weight:700}
.tag{display:inline-block;font-size:10px;font-weight:700;background:var(--good);color:var(--surface);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}

.detail{padding:2px 12px 14px;display:flex;flex-direction:column;gap:14px}
.detail h3{font-size:12px;color:var(--ink2);margin:0 0 4px;font-weight:600;letter-spacing:.04em}
.readout{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);min-height:18px}
.readout b{color:var(--ink)}
svg{display:block;width:100%;height:auto;touch-action:pan-y}
svg text{font-family:var(--font);font-size:10px;fill:var(--muted)}
svg text.v{fill:var(--ink2);font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv>div{background:var(--surface);padding:8px 10px;min-width:0}
.kv .k{font-size:11px;color:var(--ink2)}
.kv .val{font-size:16px;font-weight:700}
.kv .val.y{color:var(--good)} .kv .val.x{color:var(--bad)}
.kv .th{font-size:10px;color:var(--muted)}
a.ext{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none}
.more{width:100%;padding:12px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:14px}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);font-size:14px}

details.rules{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
details.rules summary{font-weight:600;cursor:pointer}
details.rules dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
details.rules dt{font-weight:700} details.rules dd{margin:0;color:var(--ink2)}
footer{font-size:11px;color:var(--muted);line-height:1.6}
.crit .g{background:var(--accent);color:var(--surface)}
.crit .sep{width:1px;background:var(--line);padding:0;margin:0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.card summary{font-weight:600;cursor:pointer}
.set{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.set label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink2);min-width:0}
.set select{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 4px;font-size:14px}
.set input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;font-size:16px}
.small{font-size:11px;color:var(--muted);margin-top:6px}
table.st{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
table.st th,table.st td{padding:5px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left;white-space:normal}
.ptop{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.ptop>div{background:var(--surface);padding:7px 8px}
.ptop .k{font-size:11px;color:var(--ink2)} .ptop .val{font-size:16px;font-weight:700}
.ptop .val.pos{color:var(--good)} .ptop .val.neg{color:var(--bad)}
.card h2.ch{font-size:15px;margin:0}
.order{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.order input{width:7.5em;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;font-size:16px}
.order .small{flex-basis:100%;margin:0}
.exits{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;flex-basis:100%}
.exits label{display:flex;flex-direction:column;gap:3px}
.exits label input{width:100%;box-sizing:border-box;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:16px}
#demo table.st{table-layout:auto;font-size:12px}
#demo table.st td,#demo table.st th{white-space:normal;padding:5px 3px}
#demo table.st td:last-child,#demo table.st th:last-child{white-space:nowrap}
.order input{color:var(--ink)}
.exits label.chk{grid-column:1/-1;flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.exits label.chk input{width:auto}
.order span.small{flex-basis:auto}
button.act{background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
button.mini{border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--accent);background:var(--surface)}
button.mini.warn{color:var(--bad);margin-top:10px}
button:disabled{opacity:.5}
.rowwrap{display:flex;align-items:stretch}
.rowwrap .row{flex:1;min-width:0}
button.star{flex:0 0 44px;font-size:20px;color:var(--muted);border-left:1px solid var(--line)}
button.star.on{color:#d99a00}
button.star.big{flex:none;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;padding:5px 12px;margin-left:auto}
.pr{font-size:12px;color:var(--ink2);margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px}
.dtop b{font-size:20px}
li.addnew{padding:12px;display:flex;flex-direction:column;gap:8px}
.oform{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--line);border-radius:9px;padding:3px}
.seg2 button{padding:7px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:16px;color:var(--ink)}
.fld[hidden]{display:none}
button.act.buy{background:var(--good)} button.act.sell{background:var(--bad)}
.opbox{border:1px solid var(--line);border-radius:10px;padding:4px 10px 10px;margin-top:8px}
.warnmsg{color:var(--bad);font-weight:600}
td.pre{white-space:pre-line}
details.sub{margin-top:12px} details.sub summary{font-size:12px;color:var(--ink2);font-weight:600;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheetcard{position:relative;background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.shead{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;margin:8px 0}
.shead.buy{background:var(--good-soft);color:var(--good)} .shead.sell{background:var(--bad-soft);color:var(--bad)}
.shead span{color:var(--ink);font-size:13px}
dl.conf{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 8px;font-size:13px}
dl.conf dt{color:var(--ink2)} dl.conf dd{margin:0;text-align:right;font-weight:600}
.sbtns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}
.sbtns button{padding:12px;font-size:15px}
body.modal{overflow:hidden}
.seg2.four{grid-template-columns:repeat(4,1fr);margin:10px 0}
a.act.formlink{display:block;text-align:center;text-decoration:none;margin:10px 0;padding:12px;background:var(--accent);color:var(--surface);border-radius:10px;font-weight:700}
table.rank tr.click{cursor:pointer}
table.rank td:nth-child(2){font-weight:700}
.cplayer{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.login{display:flex;flex-direction:column;gap:10px}
.seg2.two{grid-template-columns:1fr 1fr}
.fld .hint{font-size:11px;color:var(--muted)}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card h4{font-size:12px;color:var(--ink2);margin:12px 0 0;font-weight:600}
table.st thead th{color:var(--ink2);font-weight:600;border-top:0}
td.pos{color:var(--good);font-weight:700} td.neg{color:var(--bad);font-weight:700}
.plan{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.plan .ln{display:flex;justify-content:space-between;gap:8px}
.plan .ln span:first-child{color:var(--ink2)}
.plan .ln b.bad{color:var(--bad)} .plan .ln b.good{color:var(--good)}
@media (prefers-reduced-motion:no-preference){ .row{transition:background .15s} .row:active{background:var(--accent-soft)} }
</style>

<header class="top"><div class="wrap">
  <h1>スイング銘柄ランキング</h1><span class="date num" id="hdate"></span>
</div></header>

<main class="wrap">
  <div class="seg" role="tablist" id="tabs"></div>
  <section class="markets" id="markets" aria-label="市場の状態"></section>
  <div class="note" id="note" hidden></div>
  <section class="card" id="contest" hidden></section>
  <section class="card" id="democard" aria-labelledby="demoh"><h2 class="ch" id="demoh">デモトレード（仮想資金）</h2><div id="demo"></div></section>
  <details class="card" id="setbox"><summary>資金・1回の許容損失・売買単位（数量の目安に使う）</summary>
    <div class="set">
      <label>資金（円）<input id="cap" type="number" inputmode="numeric" min="0" step="10000"></label>
      <label>1回の損失上限（%）<input id="risk" type="number" inputmode="decimal" min="0.1" max="10" step="0.1"></label>
      <label>米ドル円<input id="fx" type="number" inputmode="decimal" min="1" step="0.01"></label>
      <label>日本株の売買単位<select id="jplot"><option value="100">100株（単元）</option><option value="1">1株（ミニ株）</option></select></label>
    </div>
    <div class="small" id="fxnote"></div>
  </details>
  <div class="tools" id="tools">
    <div class="chips" id="chips"></div>
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="銘柄コード・名称で絞り込み" aria-label="銘柄コード・名称で絞り込み">
    <div class="count" id="count"></div>
  </div>
  <ol class="list" id="list"></ol>
  <details class="card" id="paperbox"><summary>紙上売買の記録（自動）</summary><div id="paper"></div></details>
  <details class="card" id="statbox"><summary>過去データでのシグナル成績</summary><div id="stats"></div></details>
  <details class="rules" id="rules"><summary>判定ルール</summary><dl id="ruledl"></dl></details>
  <footer id="foot"></footer>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="注文内容の確認">
  <div class="sheetbg" id="sheetbg"></div>
  <div class="sheetcard"><h2 class="ch">注文内容の確認</h2><div id="sheetbody"></div></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
Object.keys(D.lists).forEach(function(k){ D.lists[k].key = k; });
var keys = Object.keys(D.lists).filter(function(k){ return k !== "watch"; }).concat(D.contest ? ["contest"] : []).concat(["fav"]), cfg = D.config;
var state = {tab: keys[0], filter: "all", q: "", open: null, limit: 40};
var SIGN = {BO: "ブレイクアウト", PP: "ポケットピボット", PB: "押し目（RSI2）", VCP: "収縮（VCP）"};
var opt = {cap: 300000, risk: 1, fx: D.fx ? D.fx.usdjpy : 150, jpLot: 100};
try { var so = JSON.parse(localStorage.getItem("opt") || "null"); if (so) { opt.cap = +so.cap || opt.cap; opt.risk = +so.risk || opt.risk; if (so.jpLot === 1 || so.jpLot === 100) opt.jpLot = so.jpLot; if (so.fxManual && +so.fx) { opt.fx = +so.fx; opt.fxManual = true; } } } catch (e) {}
try { var saved = localStorage.getItem("tab"); if (saved && keys.indexOf(saved) >= 0) state.tab = saved; } catch (e) {}

var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pct(v, sign){ return v == null ? "–" : (sign && v > 0 ? "+" : "") + (Math.abs(v) >= 10 ? Math.round(v * 100).toLocaleString() : (v * 100).toFixed(0)) + "%"; }
function price(v){ return v == null ? "–" : v >= 1000 ? v.toLocaleString(undefined, {maximumFractionDigits: 0}) : v >= 10 ? v.toFixed(2) : v.toPrecision(3); }
var TREND = {"1": "上昇", "0": "なし", "-1": "下降"};
var NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }

/* ---- price chart: one series, crosshair readout ---- */
function priceChart(ch){
  var W = 340, H = 150, L = 6, R = 44, T = 10, B = 18, n = ch.c.length;
  var lo = Math.min.apply(null, ch.c), hi = Math.max(Math.max.apply(null, ch.c), ch.hi);
  var pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
  var x = function(i){ return L + (W - L - R) * i / (n - 1); };
  var y = function(v){ return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
  var box = el("div");
  var read = el("div", "readout num");
  var rl = el("span"), rr = el("span");
  function show(i){ rl.textContent = ch.d[i]; rr.innerHTML = ""; var b = el("b", null, price(ch.c[i])); rr.append("終値 ", b); }
  read.append(rl, rr); box.append(read);
  var s = svg("svg", {viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "過去1年の終値の推移"});
  [lo + pad, (lo + hi) / 2, hi - pad].forEach(function(v){
    s.append(svg("line", {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1}));
    s.append(svg("text", {x: W - R + 5, y: y(v) + 3}, price(v)));
  });
  s.append(svg("line", {x1: L, x2: W - R, y1: y(ch.hi), y2: y(ch.hi), stroke: "var(--axis)", "stroke-width": 1, "stroke-dasharray": "3 3"}));

  var qRow = el("label", "small fld"); qRow.append(el("span", null, "数量" + (defaults.held > 0 ? "（保有 " + qfmt(k, r.s, defaults.held) + "）" : "")), qty);

    if (lot >= 1 && Math.abs(q / lot - Math.round(q / lot)) > 1e-9) { msg.textContent = "この銘柄は " + lot + " 株単位で注文する（設定で日本株の売買単位を変えられる）。"; return; }
    q = roundLot(k, r.s, q);
    var o = {k: k, s: r.s, side: side, type: type, q: q, cu: cu};
    if (type !== "market") { o.px = +pxIn.value; if (!(o.px > 0)) { msg.textContent = "価格を入れてほしい。"; return; } }
    if (ex) { var e = readExit(ex.st, ex.tg, msg); if (!e) return; e.on = ex.on.checked;
      if (e.on && e.st == null && e.tg == null) { msg.textContent = "自動売却には損切りか利確の価格が必要。"; return; }
      var ref = type === "market" ? r.cl : o.px;
      if (e.on && e.st != null && ref != null && e.st >= ref) { msg.textContent = "損切り価格が想定約定価格以上になっている。"; return; }
      if (e.on && e.tg != null && ref != null && e.tg <= ref) { msg.textContent = "利確価格が想定約定価格以下になっている。"; return; }
      o.auto = e.on; o.st = e.st; o.tg = e.tg; }
    showConfirm(o, r, msg);

}

function preview(o, r){
  var B = book(), rate = rateOf(o.cu), fee = feeOf(o.k), est = o.type === "market" ? r.cl : o.px;
  var h = holdingOf(o.k, o.s, B), heldNow = h ? h.q : 0, P = {B: B, rate: rate, est: est, fee: fee, h: h};
  if (!rate) { P.err = "この通貨（" + o.cu + "）の為替レートがない。"; return P; }
  if (est == null) { P.err = "価格データがまだない。明朝の更新後に注文できる。"; return P; }
  var gross = o.q * est * rate;
  P.gross = gross; P.feeYen = gross * fee; P.buyPower = B.cash - B.reserved;
  if (o.side === "buy") {
    P.total = gross + P.feeYen;
    if (P.total > P.buyPower + 1e-6) P.err = "買付余力が足りない（必要 約" + yen(P.total) + "、余力 約" + yen(P.buyPower) + "）。";
    P.cashAfter = B.cash - P.total; P.powerAfter = P.buyPower - P.total;
    P.qAfter = heldNow + o.q; P.avgAfter = ((h ? h.avg * h.q : 0) + o.q * est) / P.qAfter;
    P.equityAfter = B.equity - P.feeYen;
    P.weight = gross / Math.max(1, P.equityAfter);
    if (o.auto && o.st != null) P.lossAtStop = -((est - o.st) * o.q * rate + P.feeYen + o.q * o.st * rate * fee);
    if (o.auto && o.tg != null) P.gainAtTarget = (o.tg - est) * o.q * rate - P.feeYen - o.q * o.tg * rate * fee;
  } else {
    var avail = heldQty(o.k, o.s, B);
    if (o.q > avail + 1e-9) P.err = "売れる数量（保有から注文中の売りを除く）は " + qfmt(o.k, o.s, avail) + "。";
    P.total = gross - P.feeYen; P.cashAfter = B.cash + P.total; P.powerAfter = P.buyPower + P.total;
    P.qAfter = Math.max(0, heldNow - o.q);
    if (h) P.realized = P.total - (h.cost / h.q) * o.q;
    P.equityAfter = B.equity - P.feeYen;
  }
  return P;
}

function qfmt(k, s, q){ return fracOf(k, s) ? (+q).toFixed(4) : String(Math.round(q)); }

function showConfirm(o, r, msgEl){
  var P = preview(o, r), sheet = $("sheet"), body = $("sheetbody");
  body.innerHTML = "";
  var buy = o.side === "buy", cu = o.cu;
  var head = el("div", "shead " + (buy ? "buy" : "sell"));
  head.append(el("b", null, (buy ? "買い" : "売り") + "・" + TYPE[o.type]), el("span", null, o.s + "　" + (r.n || "")));
  body.append(head);
  var t = el("dl", "conf num");
  function line(k, v, cls){ t.append(el("dt", null, k)); t.append(el("dd", cls || null, v)); }
  function chg(a, b, fmt){ return fmt(a) + " → " + fmt(b); }
  line("数量", qfmt(o.k, o.s, o.q) + (fracOf(o.k, o.s) ? "" : " 株"));
  line("価格", o.type === "market" ? "成行（次の取引日の始値）" : money(o.px, cu) + "（" + TYPE[o.type] + "、取消まで有効・最長" + ORDER_DAYS + "取引日）");
  line("想定約定価格", money(P.est, cu) + (o.type === "market" ? "（前日終値。実際は始値で変わる）" : ""));
  if (!P.err || P.gross != null) {
    line("約定代金", (cu === "JPY" ? "" : money(o.q * P.est, cu) + " ≈ ") + yen(P.gross) + (cu === "JPY" ? "" : "（" + cu + "/円 " + P.rate + "）"));
    line("手数料（仮定 " + (P.fee * 100).toFixed(2) + "%）", yen(P.feeYen));
    line(buy ? "受渡金額（概算）" : "受取金額（概算）", yen(P.total));
    line("現金", chg(P.B.cash, P.cashAfter, yen));
    line("買付余力", chg(P.buyPower, P.powerAfter, yen), P.powerAfter < 0 ? "neg" : null);
    line("保有数量", chg(P.h ? P.h.q : 0, P.qAfter, function(v){ return qfmt(o.k, o.s, v); }));
    if (buy) {
      line("平均取得単価", money(P.h ? P.h.avg : null, cu) + " → " + money(P.avgAfter, cu));
      line("資産に占める割合", (P.weight * 100).toFixed(1) + "%");
      if (P.lossAtStop != null) line("損切り " + money(o.st, cu) + " で売れた場合", yen(P.lossAtStop, true) + "（資産の " + signPct(P.lossAtStop / P.B.equity) + "）", "neg");
      if (P.gainAtTarget != null) line("利確 " + money(o.tg, cu) + " で売れた場合", yen(P.gainAtTarget, true) + "（資産の " + signPct(P.gainAtTarget / P.B.equity) + "）", "pos");
      if (!o.auto) line("自動売却", "なし");
    } else if (P.realized != null) line("想定確定損益", yen(P.realized, true), P.realized >= 0 ? "pos" : "neg");
    line("評価額", chg(P.B.equity, P.equityAfter, yen));
  }
  body.append(t);
  var err = el("div", "small warnmsg", P.err || ""); err.hidden = !P.err; body.append(err);
  body.append(el("div", "small", "金額は前日終値と現在の為替での見込み。約定価格・手数料・為替は実際と異なる。デモ取引で、実際の注文は出ない。"));
  var row = el("div", "sbtns"), back = el("button", "mini", "戻る"), ok = el("button", "act " + (buy ? "buy" : "sell"), "注文を確定");
  back.type = ok.type = "button"; ok.disabled = !!P.err;
  back.onclick = closeConfirm;
  ok.onclick = function(){ ok.disabled = true; commitOrder(o, msgEl).then(closeConfirm, function(){ ok.disabled = false; }); };
  row.append(back, ok); body.append(row);
  sheet.hidden = false; document.body.classList.add("modal");
  $("sheet").querySelector(".sheetcard").scrollTop = 0;
  setTimeout(function(){ (P.err ? back : ok).focus({preventScroll: true}); }, 0);
}

function commitOrder(o, msgEl){
  if (!demo.db || !demo.owner) return Promise.reject();
  var L = listOf(o.k), body = {k: o.k, s: o.s, side: o.side, type: o.type, q: o.q, cu: o.cu, asof: L.asof, fx: rateOf(o.cu), placedAt: new Date().toISOString(), status: "open"};
  if (o.type !== "market") body.px = o.px;
  if (o.side === "buy") { body.auto = !!o.auto; body.st = o.st == null ? null : o.st; body.tg = o.tg == null ? null : o.tg; }
  msgEl.textContent = "送信中…";
  var acct = demo.account ? Promise.resolve() : demo.db.doc("demo/account").set({capital: CAPITAL, started: new Date().toISOString().slice(0, 10)});
  return acct.then(function(){ return demo.db.collection("demo/account/orders").add(body); })
    .then(function(){ msgEl.textContent = (o.side === "buy" ? "買い" : "売り") + "注文（" + TYPE[o.type] + "）を受け付けた。約定は毎朝の更新後に反映される。"; },
      function(e){ msgEl.textContent = e && e.code === "quota_exceeded" ? "保存容量の上限に達した。リセットしてほしい。" : "保存できなかった（" + (e && e.code || "error") + "）。"; throw e; });
}

function readExit(stEl, tgEl, msgEl){
  var st = stEl.value === "" ? null : +stEl.value, tg = tgEl.value === "" ? null : +tgEl.value;
  if ((st != null && !(st > 0)) || (tg != null && !(tg > 0))) { msgEl.textContent = "価格は正の数で入れてほしい。"; return false; }
  if (st != null && tg != null && st >= tg) { msgEl.textContent = "損切り価格は利確価格より低くしてほしい。"; return false; }
  return {st: st, tg: tg};
}

/* Browser-only store with the same calls the page makes on the claude.ai db: used when the
   page is served anywhere else (e.g. GitHub Pages). Data stays in this browser only. */
function localDb(){
  var KEY = "tradelab-demo-v1", store = {}, subs = [];
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); return true; } catch (e) { return false; } }
  function notify(){ setTimeout(function(){ subs.forEach(function(f){ f(); }); }, 0); }
  function clone(x){ return x == null ? x : JSON.parse(JSON.stringify(x)); }
  function snap(path){ var d = store[path]; return {id: path.split("/").pop(), exists: d != null, data: function(){ return clone(d); }, metadata: {fromCache: false, hasPendingWrites: false}}; }
  function write(fn){ fn(); if (!save()) return Promise.reject({code: "quota_exceeded"}); notify(); return Promise.resolve(); }
  function doc(path){ return {id: path.split("/").pop(), path: path,
    get: function(){ return Promise.resolve(snap(path)); },
    set: function(d){ return write(function(){ store[path] = clone(d); }); },
    update: function(d){ if (store[path] == null) return Promise.reject({code: "invalid_argument"}); return write(function(){ Object.assign(store[path], clone(d)); }); },
    delete: function(){ return write(function(){ delete store[path]; }); },
    onSnapshot: function(next){ var f = function(){ next(snap(path)); }; subs.push(f); setTimeout(f, 0); return function(){ subs.splice(subs.indexOf(f), 1); }; } }; }
  function coll(path){ return {path: path,
    doc: function(id){ return doc(path + "/" + (id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8))); },
    add: function(d){ var r = this.doc(); return r.set(d).then(function(){ return r; }); },
    onSnapshot: function(next){ var f = function(){
      var docs = Object.keys(store).filter(function(k){ return k.indexOf(path + "/") === 0 && k.slice(path.length + 1).indexOf("/") < 0; }).sort().map(snap);
      next({docs: docs, size: docs.length, empty: !docs.length, docChanges: function(){ return []; }, metadata: {fromCache: false, hasPendingWrites: false}}); };
      subs.push(f); setTimeout(f, 0); return function(){ subs.splice(subs.indexOf(f), 1); }; } }; }
  return {doc: doc, collection: coll};
}

/* ---- accounts on Supabase (ID + password). Same calls as the browser store, so the
   demo screens work unchanged; fills are recomputed here and on the server from the
   same rules, and the server's result is what the ranking uses. ---- */
var SB_LIB = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
var acct = {sb: null, user: null, name: "", mode: "login", msg: "", busy: false};
function authCfg(){ return D.contest && D.contest.auth && D.contest.auth.url && D.contest.auth.key ? D.contest.auth : null; }
function loadScript(src){ return new Promise(function(ok, ng){ var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ng; document.head.append(s); }); }

function remoteDb(sb, uid){
  var cache = {orders: [], exits: [], favorites: []}, subs = {orders: [], exits: [], favorites: [], account: []};
  function emit(kind){ subs[kind].forEach(function(f){ f(); }); }
  function fail(e){ var err = {code: (e && (e.code || e.message)) || "error"}; throw err; }
  function load(kind){
    var q = sb.from(kind).select("*"); if (kind === "orders") q = q.order("id", {ascending: true});
    return q.then(function(r){ if (r.error) fail(r.error); cache[kind] = r.data || []; emit(kind); });
  }
  function snap(id, data){ return {id: id, exists: data != null, data: function(){ return data == null ? undefined : JSON.parse(JSON.stringify(data)); }, metadata: {fromCache: false, hasPendingWrites: false}}; }
  function qsnap(docs){ return {docs: docs, size: docs.length, empty: !docs.length, docChanges: function(){ return []; }, metadata: {fromCache: false, hasPendingWrites: false}}; }
  function keyOf(s){ var x = findRow(s); return x ? x.k : ""; }
  var views = {
    orders: function(){
      var cancelled = {};
      cache.orders.forEach(function(r){ if (r.side === "cancel" && r.target) cancelled[r.target] = r.created_at; });
      return cache.orders.filter(function(r){ return r.side !== "cancel"; }).map(function(r){
        return snap(String(r.id), {k: r.k || keyOf(r.symbol), s: r.symbol, side: r.side, type: r.type, q: r.qty, px: r.px, st: r.st, tg: r.tg,
          auto: !!r.auto, cu: r.cu || curOf(r.k || keyOf(r.symbol), r.symbol), fx: r.fx || rateOf(r.cu || "USD") || opt.fx,
          asof: r.asof || r.created_at.slice(0, 10), placedAt: r.created_at, status: cancelled[r.id] ? "cancelled" : "open"});
      });
    },
    exits: function(){ return cache.exits.map(function(r){ var k = r.k || keyOf(r.symbol); return snap(exitKey(k, r.symbol), {k: k, s: r.symbol, on: !!r.enabled, st: r.st, tg: r.tg, setAt: r.set_at}); }); },
    favorites: function(){ return cache.favorites.map(function(r){ return snap(safeId(r.symbol), {s: r.symbol, addedAt: r.added_at}); }); }
  };
  var KIND = {"demo/account/orders": "orders", "demo/account/exits": "exits", "demo/account/watch": "favorites"};
  function collection(path){
    var kind = KIND[path];
    return {path: path,
      onSnapshot: function(next, err){ var f = function(){ next(qsnap(views[kind]())); }; subs[kind].push(f); load(kind).catch(function(e){ if (err) err(e); }); return function(){}; },
      add: function(b){
        return sb.from("orders").insert({symbol: b.s, side: b.side, type: b.type || "market", qty: b.q, px: b.px == null ? null : b.px,
          st: b.st == null ? null : b.st, tg: b.tg == null ? null : b.tg, k: b.k, cu: b.cu, fx: b.fx, asof: b.asof, auto: !!b.auto})
          .then(function(r){ if (r.error) fail(r.error); return load("orders"); });
      },
      doc: function(id){ return doc(path + "/" + id); }};
  }
  function doc(path){
    if (path === "demo/account") {
      var cap = {capital: D.contest.capital || 10000000, started: D.contest.start || ""};
      return {onSnapshot: function(next){ setTimeout(function(){ next(snap("account", cap)); }, 0); return function(){}; },
        set: function(){ return Promise.resolve(); }, update: function(){ return Promise.resolve(); }, get: function(){ return Promise.resolve(snap("account", cap)); }};
    }
    var parts = path.split("/"), id = parts.pop(), kind = KIND[parts.join("/")];
    return {
      update: function(patch){
        if (kind === "orders" && patch && patch.status === "cancelled")
          return sb.from("orders").insert({side: "cancel", target: +id, symbol: ""}).then(function(r){ if (r.error) fail(r.error); return load("orders"); });
        return Promise.resolve();                          // fills and expiry are recomputed, never stored
      },
      set: function(d){
        if (kind === "exits") return sb.from("exits").upsert({user_id: uid, symbol: d.s, k: d.k, enabled: !!d.on, st: d.st == null ? null : d.st, tg: d.tg == null ? null : d.tg}, {onConflict: "user_id,symbol"})
          .then(function(r){ if (r.error) fail(r.error); return load("exits"); });
        if (kind === "favorites") return sb.from("favorites").upsert({user_id: uid, symbol: d.s}, {onConflict: "user_id,symbol", ignoreDuplicates: true})
          .then(function(r){ if (r.error) fail(r.error); return load("favorites"); });
        return Promise.resolve();                          // automatic sells are recomputed, never stored
      },
      delete: function(){
        var row = (cache[kind] || []).filter(function(r){ return (kind === "exits" ? exitKey(r.k || keyOf(r.symbol), r.symbol) : safeId(r.symbol)) === id; })[0];
        if (!row || kind === "orders") return Promise.resolve();
        return sb.from(kind).delete().eq("symbol", row.symbol).then(function(r){ if (r.error) fail(r.error); return load(kind); });
      }
    };
  }
  return {doc: doc, collection: collection};
}

function startStore(db, owner){
    demo.db = db; if (owner) demo.owner = true;
    var timer = setTimeout(function(){ if (demo.state === "loading") { demo.note = "記録をまだ読み込めない。通信状態を確認してほしい。"; render(); } }, 10000);
    var got = {orders: false, account: false, exits: false, watch: false};
    function ready(){ if (got.orders && got.account && got.exits && got.watch) { clearTimeout(timer); if (demo.state === "loading") demo.note = ""; demo.state = "ready"; } render(); }
    function fail(e){ clearTimeout(timer); demo.state = "ready"; demo.note = "記録を読めなかった（" + e.code + "）。"; render(); }
    db.doc("demo/account").onSnapshot(function(s){ demo.account = s.exists ? s.data() : null; if (!s.metadata.fromCache) got.account = true; ready(); }, fail);
    db.collection("demo/account/exits").onSnapshot(function(s){
      var m = {}; s.docs.forEach(function(d){ m[d.id] = d.data(); }); demo.exits = m;
      if (!s.metadata.fromCache) got.exits = true; ready(); }, fail);
    db.collection("demo/account/watch").onSnapshot(function(s){
      var m = {}; s.docs.forEach(function(d){ m[d.id] = d.data(); }); demo.watch = m;
      if (!s.metadata.fromCache) got.watch = true; ready(); }, fail);
    db.collection("demo/account/orders").onSnapshot(function(s){
      demo.orders = s.docs.map(function(d){ var o = Object.assign({}, d.data()); o.id = d.id; return o; });
      if (!s.metadata.fromCache) got.orders = true; ready(); }, fail);
}

  if (!rows.length) {

    list.append(el("li", "empty", msg));
  }
  rows.slice(0, state.limit).forEach(function(x){
    list.append(rowItem(x[0], state.tab, L, String(x[1]), {chg: change(x[0], x[1], L)}));
  });
  if (rows.length > state.limit) {
    var li = el("li"), more = el("button", "more", "さらに表示（残り " + (rows.length - state.limit) + "）");
    more.type = "button"; more.onclick = function(){ state.limit += 60; render(); }; li.append(more); list.append(li);
  }

  var dl = $("ruledl"); dl.innerHTML = "";
  var R = {
    C: "直近四半期の希薄化後EPSが前年同期比 +" + pct(cfg.c_min_eps_growth) + " 以上",
    A: "年次EPSの年平均成長率 +" + pct(cfg.a_min_eps_cagr) + " 以上、毎年増益、ROE " + pct(cfg.a_min_roe) + " 以上",
    N: "終値が52週高値から " + pct(cfg.n_max_below_high) + " 以内",
    S: "直近50日の上昇日出来高 ÷ 下落日出来高が " + cfg.s_min_updown_volume + " 以上",
    L: "相対的強さ（直近12か月の騰落率、直近3か月を2倍に加重）が対象内の上位 " + (100 - cfg.l_min_rs_rank) + "% 以内",
    DOW: "高値と安値を切り上げるダウ理論の上昇トレンド。終値が直近の押し安値を割ると終了",
    TT: "トレンドテンプレート（M.ミネルヴィニ）。終値が150日・200日平均より上、50日>150日>200日の並び、200日平均が1か月前より上、52週安値から+30%以上、52週高値から25%以内"
  };
  L.crit.forEach(function(c){ dl.append(el("dt", null, c), el("dd", null, R[c])); });
  dl.append(el("dt", null, "BO"), el("dd", null, "ブレイクアウト: 終値が直近" + cfg.bo_lookback + "日の高値を超え、出来高が50日平均の" + cfg.bo_volume + "倍以上"));
  dl.append(el("dt", null, "PP"), el("dd", null, "ポケットピボット（モラレス、カッチャー）: 上昇日の出来高が直近" + cfg.pp_lookback + "日の下落日出来高をすべて上回り、終値が50日平均より上"));
  dl.append(el("dt", null, "PB"), el("dd", null, "押し目（L.コナーズ）: 終値が200日平均より上で、RSI(2)が" + cfg.pb_rsi + "未満"));
  dl.append(el("dt", null, "VCP"), el("dd", null, "値幅の収縮（簡易版）: 直近10日の値幅がATR(50)の" + cfg.vcp_range_atr + "倍以内、ATR(10)がATR(50)の" + cfg.vcp_atr_ratio + "倍以下、52週高値から" + Math.round(cfg.vcp_near_high * 100) + "%以内"));
  dl.append(el("dt", null, "点数"), el("dd", null, "質の条件（" + L.crit.join("・") + "）の合格数に、BO・PP・PB・VCPのどれかが出ていれば1点を加える。満点 " + L.max));
  dl.append(el("dt", null, "候補"), el("dd", null, "質の条件をすべて満たし、シグナルが1つ以上出て、市場条件 M が合格の銘柄"));
  dl.append(el("dt", null, "M"), el("dd", null, "市場指数がダウ理論の上昇トレンドにあり、200日移動平均より上。不合格の日は候補を出さない"));
  if (L.crit.indexOf("C") >= 0) dl.append(el("dt", null, "I"), el("dd", null, "機関投資家の保有動向。データを取得できないため未評価"));
  if (state.tab === "jp") dl.append(el("dt", null, "－"), el("dd", null, "C・A の点線の印は決算データを取得できず判定できないもの。合格に数えない。日本株の市場条件 M は TOPIX 連動ETF（1306.T）で判定する。売買単位は設定で100株／1株を選べる"));
  if (state.tab === "etf") dl.append(el("dt", null, "注"), el("dd", null, "ETF には決算がないため、値動きの条件だけで判定する。L は ETF の中での順位。市場条件 M は S&P 500 で判定する（日本の ETF も同じ）"));
  if (state.tab === "crypto") dl.append(el("dt", null, "注"), el("dd", null, "暗号資産には決算がないため、値動きの条件だけで判定する。数量は小数第4位まで"));
  renderStats();
  renderPaper();
  renderDemo();
  $("foot").textContent = "対象: " + L.universe + "（評価不能 " + L.failed + " 銘柄を除く）。作成 " + D.generated + " JST。" +
    "条件に合致した銘柄の一覧で、売買の推奨ではない。シグナルの過去成績は「過去データでのシグナル成績」を参照。CAN SLIM の決算条件は過去検証できていない。データは Yahoo Finance 由来で、誤りや遅延を含みうる。";
}
$("q").addEventListener("input", function(e){ state.q = e.target.value; state.limit = 40; render(); var i = $("q"); i.focus(); });
function loadBars(){
  var files = D.barsFiles || {}; D.opens = D.opens || {};
  Object.keys(files).forEach(function(k){
    fetch(files[k], {cache: "no-cache"}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(b){ D.opens[k] = b; render(); })
      .catch(function(){ demo.note = "約定判定用の値動きデータ（" + files[k] + "）を読めなかった。再読み込みしてほしい。"; render(); });
  });
}
$("sheetbg").addEventListener("click", closeConfirm);
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("sheet").hidden) closeConfirm(); });
initSettings();
render();
loadBars();
startDemo();
})();
</script>
