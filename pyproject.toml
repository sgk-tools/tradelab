[project]
name = "tradelab"
version = "0.6.0"
description = "Market-agnostic backtesting lab for trading strategy research"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "requests>=2.28", "xlrd>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
