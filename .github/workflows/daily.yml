name: daily-update

on:
  schedule:
    - cron: "13 22 * * *"   # 毎日 07:13 JST（GitHub の混雑で数十分遅れることがある）
  workflow_dispatch:         # Actions 画面から手動実行もできる

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.0" "numpy>=1.24" "matplotlib>=3.7" "requests>=2.28" pytest
      - name: Test
        run: python -m pytest -q
      - name: Build ranking (previous docs/data.json and docs/ledger.json are reused)
        run: python -m tradelab app --out docs --watch watch.txt
      - name: Publish
        run: |
          rm -f docs/page.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "daily update $(date -u +%Y-%m-%d)"
          git push
